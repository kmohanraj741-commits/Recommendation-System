apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-v1
  template:
    metadata:
      labels:
        app: recommendation-v1
    spec:
      containers:
        - name: recommendation-system
          image: YOUR_DOCKERHUB_USERNAME/recommendation-system:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "v1"
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-v1-service
spec:
  type: NodePort
  selector:
    app: recommendation-v1
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
